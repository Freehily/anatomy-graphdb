[tool.poetry]
name = "stronger-anatomy"
version = "0.1.0"
description = "Canonical anatomy domain dataset and Neo4j graph builder for Stronger."
license = "MIT"
authors = ["Tom <tomrfreeman3@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/Freehily/stronger-domain-graphdb"
repository = "https://github.com/Freehily/stronger-domain-graphdb"
documentation = "https://github.com/Freehily/stronger-domain-graphdb#readme"
keywords = ["anatomy", "neo4j", "graphdb", "fitness", "domain-model"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "stronger_anatomy"}]
include = [
  {path = "config/**/*.yaml", format = ["sdist", "wheel"]},
  {path = "svgs/**", format = ["sdist", "wheel"]},
  {path = "stronger_anatomy/assets/**", format = ["sdist", "wheel"]},
]

[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "^6.0.3"
neo4j = "^6.0.2"
pyaml = "^25.7.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
pytest = "^8.4.1"

[tool.poetry.scripts]
stronger-anatomy = "stronger_anatomy.cli.anatomy:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
