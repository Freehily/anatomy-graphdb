---
# arteries.yaml lists plantar arterial arches relevant to intrinsic foot muscles.

arteries:
  - id: medial_plantar_artery
    name: Medial Plantar Artery
    branches_from: posterior_tibial_artery
    supplies: [abductor_hallucis_head, flexor_digitorum_brevis_head, lumbrical_1_head]

  - id: lateral_plantar_artery
    name: Lateral Plantar Artery
    branches_from: posterior_tibial_artery
    supplies: [abductor_digiti_minimi_head, quadratus_plantae_head, lumbrical_2_4_head]
