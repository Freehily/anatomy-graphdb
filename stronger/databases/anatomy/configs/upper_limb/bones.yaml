---
#   id (node): Unique identifier for the bone, used as a key node in the database.
#   name: Human-readable name of the bone node.
#   region: Anatomical region where the bone is located; useful for categorization.
#   attachments (relationships): List of node IDs corresponding to attachment_point nodes defined in attachment_points.yaml, representing the specific anatomical landmarks where muscles attach.# bones.yaml defines bone nodes for the anatomical graph database.

bones:
  - id: scapula
    name: Scapula
    region: Shoulder Girdle
    attachments: [
      coracoid_process,
      supraglenoid_tubercle,
      infraglenoid_tubercle,
      spine_of_scapula,
      acromion,
      glenoid_cavity,
      supraspinous_fossa,
      infraspinous_fossa,
      subscapular_fossa,
      medial_border_scapula,
      lateral_border_scapula,
      inferior_angle_scapula
    ]

  - id: clavicle
    name: Clavicle
    region: Shoulder Girdle
    attachments: [
      sternal_end,
      acromial_end,
      medial_clavicle,
      lateral_clavicle
    ]

  - id: humerus
    name: Humerus
    region: Upper Arm
    attachments: [
      head_of_humerus,
      greater_tubercle,
      lesser_tubercle,
      intertubercular_groove,
      medial_lip_intertubercular_sulcus,
      deltoid_tuberosity,
      medial_epicondyle,
      lateral_epicondyle,
      lateral_supracondylar_ridge,
      midshaft_humerus_medial,
      above_radial_groove,
      below_radial_groove,
      intertubercular_sulcus
    ]

  - id: radius
    name: Radius
    region: Forearm
    attachments: [
      head_of_radius,
      radial_tuberosity,
      anterior_radius,
      posterior_radius,
      styloid_process_of_radius,
      ulnar_notch,
      distal_radius_anterior,
      distal_radius_ulnar_notch,
      midshaft_radius,
      proximal_radius
    ]

  - id: ulna
    name: Ulna
    region: Forearm
    attachments: [
      olecranon_process,
      coronoid_process,
      ulnar_tuberosity,
      styloid_process_of_ulna,
      radial_notch,
      posterior_border_ulna,
      posterior_ulna,
      proximal_ulna,
      distal_ulna_anterior
    ]

  - id: hand
    name: Hand
    region: Distal Upper Limb
    attachments: [
      pisiform,
      hamate,
      base_of_1st_metacarpal,
      base_of_2nd_metacarpal,
      base_of_3rd_metacarpal,
      base_of_5th_metacarpal,
      middle_phalanges_2_5,
      proximal_phalanges_2_3_4,
      proximal_phalanges_2_4_5,
      medial_side_proximal_phalanx_thumb,
      lateral_side_proximal_phalanx_thumb,
      proximal_phalanx_thumb_dorsal,
      distal_phalanges_2_5,
      distal_phalanx_thumb,
      lateral_1st_metacarpal,
      medial_5th_metacarpal,
      proximal_phalanx_5_medial,
      proximal_phalanx_5_palmar,
      scaphoid_tubercle,
      trapezium_tubercle,
      hook_of_hamate,
      extensor_expansions_2_5,
      extensor_expansions_4_5,
      extensor_expansion_2,
      extensor_expansion_5
    ]

  - id: sternum
    name: Sternum
    region: Thorax
    attachments: [
      sternum_body
    ]

  - id: thoracic_cage
    name: Thoracic Cage
    region: Thorax
    attachments: [
      costal_cartilages_1_6
    ]

  - id: fascia
    name: Fascia
    region: Connective Tissue
    attachments: [
      bicipital_aponeurosis,
      palmar_aponeurosis,
      flexor_retinaculum
    ]

  - id: interosseous_membrane
    name: Interosseous Membrane
    region: Forearm Connective Tissue
    attachments: [interosseous_membrane]

  - id: tendons
    name: Tendons
    region: Upper Limb Tendons
    attachments: [
      fdp_tendon_digit2,
      fdp_tendon_digit3,
      fdp_tendon_digit4,
      fdp_tendon_digit5
    ]
