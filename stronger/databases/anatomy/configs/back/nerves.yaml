---
# nerves.yaml lists neural supply for back musculature.

nerves:
  - id: spinal_accessory_nerve
    name: Spinal Accessory Nerve (CN XI)
    derivations: [C1, C2, Cranial]
    type: [motor]
    pathway: Exits jugular foramen, travels deep to trapezius along posterior triangle.
    clinical_significance: Injury causes shoulder droop and weakened scapular elevation.
    innervates: [trapezius_upper_head, trapezius_middle_head, trapezius_lower_head]

  - id: dorsal_scapular_nerve
    name: Dorsal Scapular Nerve
    derivations: [C4, C5]
    type: [motor]
    pathway: Pierces middle scalene, descends along medial scapular border.
    clinical_significance: Lesions weaken scapular retraction and elevation.
    innervates: [levator_scapulae_head, rhomboid_minor_head, rhomboid_major_head]

  - id: thoracodorsal_nerve
    name: Thoracodorsal Nerve
    derivations: [C6, C7, C8]
    type: [motor]
    pathway: Runs with thoracodorsal artery along posterior axillary wall to latissimus dorsi.
    clinical_significance: Damage during axillary surgery compromises shoulder extension and adduction.
    innervates: [latissimus_dorsi_head]

  - id: intercostal_nerves
    name: Intercostal Nerves
    derivations: [T1, T2, T3, T4, T5, T6, T7, T8, T9, T10, T11]
    type: [motor, sensory]
    pathway: Travel within intercostal spaces beneath ribs, supplying thoracic wall and overlying muscles.
    clinical_significance: Entrapment causes segmental thoracic pain and breathing difficulty.
    innervates: [serratus_posterior_superior_back_head, serratus_posterior_inferior_back_head]

  - id: posterior_primary_rami_spinal
    name: Posterior Primary Rami of Spinal Nerves
    derivations: [C1, C2, C3, C4, C5, C6, C7, C8, T1, T2, T3, T4, T5, T6, T7, T8, T9, T10, T11, T12, L1, L2, L3, L4, L5]
    type: [motor, sensory]
    pathway: Branch from dorsal roots to supply intrinsic back muscles and overlying skin.
    clinical_significance: Compression leads to back muscle weakness and dermatomal pain.
    innervates: [
      erector_spinae_spinalis,
      erector_spinae_longissimus,
      erector_spinae_iliocostalis,
      multifidus_head,
      semispinalis_capitis_head,
      semispinalis_cervicis_head,
      splenius_capitis_head,
      splenius_cervicis_head
    ]
