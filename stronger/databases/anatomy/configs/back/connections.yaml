---
# connections.yaml catalogs articulations and fascial continuities relevant to the back.

connections:
  - id: atlanto_occipital_joint
    name: Atlanto-Occipital Joint
    type: synovial_condylar
    structures: [skull, cervical_vertebrae]
    notes: Allows nodding motions between occipital condyles and atlas.

  - id: atlanto_axial_joint
    name: Atlanto-Axial Joint
    type: synovial_pivot
    structures: [cervical_vertebrae]
    notes: Median and lateral joints between atlas and axis enabling rotation.

  - id: scapulothoracic_interface
    name: Scapulothoracic Interface
    type: functional_articulation
    structures: [scapula, thoracic_ribs]
    notes: Fascial plane allowing scapular gliding over thoracic cage.

  - id: thoracolumbar_fascia_continuity
    name: Thoracolumbar Fascia Continuity
    type: fascial_connection
    structures: [thoracolumbar_fascia_back, pelvis, thoracolumbar_spine]
    notes: Transmits forces between lower limbs and upper body via intrinsic back muscles.
