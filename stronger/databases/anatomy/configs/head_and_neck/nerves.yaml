---
# nerves.yaml catalogs cranial and cervical nerves supplying head/neck muscles.

nerves:
  - id: spinal_accessory_nerve
    name: Spinal Accessory Nerve (CN XI)
    derivations: [C1, C2, Cranial]
    type: [motor]
    pathway: Emerges from jugular foramen, crosses posterior triangle to deep surface of sternocleidomastoid and trapezius.
    clinical_significance: Injury produces shoulder droop and difficulty turning head.
    innervates: [sternocleidomastoid_sternal_head, sternocleidomastoid_clavicular_head]

  - id: facial_nerve
    name: Facial Nerve (CN VII)
    derivations: [Cranial]
    type: [motor, sensory]
    pathway: Exits stylomastoid foramen, innervates posterior belly of digastric and stylohyoid before entering parotid gland.
    clinical_significance: Lesions impair facial expression and suprahyoid function.
    innervates: [digastric_posterior_belly, stylohyoid_head]

  - id: nerve_to_mylohyoid
    name: Nerve to Mylohyoid
    derivations: [V3]
    type: [motor]
    pathway: Branches from inferior alveolar nerve prior to mandibular foramen, courses along mylohyoid groove.
    clinical_significance: Injury reduces floor-of-mouth elevation and weakens hyoid elevation.
    innervates: [digastric_anterior_belly, mylohyoid_head]

  - id: hypoglossal_nerve
    name: Hypoglossal Nerve (CN XII)
    derivations: [Cranial]
    type: [motor]
    pathway: Runs deep to posterior belly of digastric, giving C1 fibers to geniohyoid and thyrohyoid.
    clinical_significance: Damage causes tongue deviation and weak hyoid elevation.
    innervates: [geniohyoid_head, thyrohyoid_head]

  - id: ansa_cervicalis
    name: Ansa Cervicalis
    derivations: [C1, C2, C3]
    type: [motor]
    pathway: Loop formed on carotid sheath giving branches to infrahyoid muscles.
    clinical_significance: Lesion impairs swallowing due to infrahyoid weakness.
    innervates: [sternohyoid_head, sternothyroid_head, omohyoid_inferior_head, omohyoid_superior_head]
