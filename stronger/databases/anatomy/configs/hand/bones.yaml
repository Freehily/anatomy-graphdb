---
# bones.yaml lists hand skeletal and connective structures referenced by intrinsic muscles.

bones:
  - id: carpal_scaphoid
    name: Scaphoid
    region: Carpus
    attachments: [tubercle_scaphoid]

  - id: carpal_trapezium
    name: Trapezium
    region: Carpus
    attachments: [tubercle_trapezium]

  - id: carpal_hamate
    name: Hamate
    region: Carpus
    attachments: [hook_of_hamate]

  - id: carpal_pisiform
    name: Pisiform
    region: Carpus
    attachments: [pisiform]

  - id: metacarpal_1
    name: 1st Metacarpal
    region: Hand
    attachments: [base_first_metacarpal_lateral, base_first_metacarpal_medial]

  - id: metacarpal_2
    name: 2nd Metacarpal
    region: Hand
    attachments: [base_second_metacarpal]

  - id: metacarpal_3
    name: 3rd Metacarpal
    region: Hand
    attachments: [base_third_metacarpal]

  - id: metacarpal_4
    name: 4th Metacarpal
    region: Hand
    attachments: [base_fourth_metacarpal]

  - id: metacarpal_5
    name: 5th Metacarpal
    region: Hand
    attachments: [base_fifth_metacarpal]

  - id: metacarpals
    name: Metacarpal Shafts
    region: Hand
    attachments: [metacarpal_shaft_palmar_2_to_5, metacarpal_shaft_dorsal_2_to_5]

  - id: phalanx_thumb_proximal
    name: Proximal Phalanx of Thumb
    region: Hand
    attachments: [proximal_phalanx_thumb_lateral, proximal_phalanx_thumb_medial]

  - id: phalanges_proximal
    name: Proximal Phalanges 2-5
    region: Hand
    attachments: [proximal_phalanges_2_5_palmar]

  - id: extensor_expansion
    name: Extensor Expansion (Digits 2-5)
    region: Hand
    attachments: [extensor_expansion_2, extensor_expansion_3, extensor_expansion_4, extensor_expansion_5]

  - id: tendons
    name: Tendons
    region: Hand
    attachments: [tendons_fdp_2_to_5]

  - id: fascia
    name: Hand Fascia
    region: Connective Tissue
    attachments: [flexor_retinaculum, extensor_retinaculum, palmar_aponeurosis]
