---
# bones.yaml lists osseous and structural elements of the thoracic cage.

bones:
  - id: sternum
    name: Sternum
    region: Thorax
    attachments: [manubrium, sternal_body, xiphoid_process]

  - id: costal_cartilages
    name: Costal Cartilages
    region: Thorax
    attachments: [
      costal_cartilages_1_7_anterior,
      costal_cartilages_2_6_inner_surface,
      costal_cartilages_7_10_inner_surface,
      costal_margin_internal_surface
    ]

  - id: thoracic_ribs
    name: Ribs 1-12
    region: Thorax
    attachments: [
      ribs_1_11_superior_border,
      ribs_2_5_superior_border,
      ribs_1_11_inferior_border,
      ribs_9_12_inferior_border,
      ribs_2_6_internal_surface,
      ribs_7_10_internal_surface,
      rib_angles_lower,
      rib_12_inferior_border
    ]

  - id: rib_1
    name: First Rib
    region: Thorax
    attachments: [scalene_tubercle_rib1]

  - id: thoracic_vertebrae
    name: Thoracic Vertebrae
    region: Spine
    attachments: [
      transverse_processes_T7_T11,
      spinous_processes_C7_T3,
      spinous_processes_T11_L2
    ]

  - id: thoracolumbar_spine
    name: Thoracolumbar Spine
    region: Spine
    attachments: [spinous_processes_T11_L2]

  - id: lumbar_vertebrae
    name: Lumbar Vertebrae
    region: Spine
    attachments: [lumbar_bodies_L1_L3]

  - id: ligaments
    name: Ligaments
    region: Connective Tissue
    attachments: [nuchal_ligament]

  - id: diaphragm
    name: Diaphragm Structure
    region: Thorax
    attachments: [central_tendon_diaphragm, medial_arcuate_ligaments, lateral_arcuate_ligaments]

  - id: fascia
    name: Thoracic Fascia
    region: Connective Tissue
    attachments: [thoracolumbar_fascia]
