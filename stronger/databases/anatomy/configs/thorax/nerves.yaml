---
# nerves.yaml lists nervous structures relevant to thoracic musculature.

nerves:
  - id: intercostal_nerves
    name: Intercostal Nerves (T1-T11 Ventral Rami)
    derivations: [T1, T2, T3, T4, T5, T6, T7, T8, T9, T10, T11]
    type: [motor, sensory]
    pathway: Run within costal groove between internal and innermost intercostal muscles, accompanied by intercostal vessels.
    clinical_significance: Intercostal nerve blocks relieve thoracic wall pain; injury causes segmental weakness of intercostal muscles.
    innervates: [
      external_intercostals,
      internal_intercostals,
      innermost_intercostals,
      subcostals,
      transversus_thoracis,
      serratus_posterior_superior
    ]

  - id: subcostal_nerve
    name: Subcostal Nerve (T12 Ventral Ramus)
    derivations: [T12]
    type: [motor, sensory]
    pathway: Courses inferior to rib 12 along abdominal wall with subcostal artery and vein.
    clinical_significance: May be injured during kidney or posterior abdominal surgery leading to abdominal wall weakness.
    innervates: [serratus_posterior_inferior, subcostals]

  - id: posterior_primary_rami_T7_T12
    name: Posterior Primary Rami T7-T12
    derivations: [T7, T8, T9, T10, T11, T12]
    type: [motor, sensory]
    pathway: Emerge from intervertebral foramina, course posteriorly to supply intrinsic back muscles.
    clinical_significance: Entrapment can refer pain to thoracic wall via levatores costarum.
    innervates: [levatores_costarum]

  - id: phrenic_nerve
    name: Phrenic Nerve
    derivations: [C3, C4, C5]
    type: [motor, sensory]
    pathway: Descends on anterior scalene, passes through thorax between mediastinal pleura and pericardium to diaphragm.
    clinical_significance: Injury results in ipsilateral diaphragmatic paralysis and respiratory compromise.
    innervates: [diaphragm_sternal, diaphragm_costal, diaphragm_lumbar]
