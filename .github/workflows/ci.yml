name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        run: poetry run pytest -q

      - name: CLI smoke tests
        run: |
          poetry run anatomy-graphdb --list-regions
          poetry run anatomy-graphdb --region chest --validate-only
          poetry run anatomy-graphdb --export-catalog --region all --catalog-output /tmp/anatomy_catalog.json

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Build wheel and sdist
        run: poetry build

      - name: Verify wheel install
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import stronger_anatomy; print(stronger_anatomy.__version__)"
          /tmp/wheel-venv/bin/anatomy-graphdb --list-regions

      - name: Verify sdist install
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "from stronger_anatomy import AnatomyLoader; print(len(AnatomyLoader().available_regions()))"
