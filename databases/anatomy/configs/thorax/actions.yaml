---
# actions.yaml defines respiratory and thoracic wall movements.

actions:
  - id: rib_elevation
    name: Rib Elevation
    joint: costovertebral
    type: elevation
    primary_movers: [external_intercostals, serratus_posterior_superior, levatores_costarum]

  - id: rib_depression
    name: Rib Depression
    joint: costovertebral
    type: depression
    primary_movers: [internal_intercostals, innermost_intercostals, subcostals, transversus_thoracis, serratus_posterior_inferior]

  - id: thoracic_inspiration
    name: Thoracic Inspiration
    joint: thoracic_cavity
    type: inspiration
    primary_movers: [external_intercostals, serratus_posterior_superior, levatores_costarum, diaphragm_sternal, diaphragm_costal, diaphragm_lumbar]

  - id: forced_expiration
    name: Forced Expiration
    joint: thoracic_cavity
    type: expiration
    primary_movers: [internal_intercostals, innermost_intercostals, subcostals, transversus_thoracis, serratus_posterior_inferior]

  - id: thoracic_rotation
    name: Thoracic Rotation Assistance
    joint: thoracic_spine
    type: rotation
    primary_movers: [levatores_costarum]

  - id: abdominal_compression
    name: Abdominal Compression
    joint: thoracoabdominal
    type: compression
    primary_movers: [diaphragm_sternal, diaphragm_costal, diaphragm_lumbar]
