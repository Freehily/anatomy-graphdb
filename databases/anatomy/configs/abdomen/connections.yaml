---
# connections.yaml outlines key abdominal fascial planes and aponeurotic structures.

connections:
  - id: rectus_sheath_enclosure
    name: Rectus Sheath Enclosure
    type: aponeurotic_layer
    structures: [rectus_sheath, linea_alba]
    notes: Aponeuroses of obliques and transversus form anterior/posterior walls surrounding rectus abdominis.

  - id: inguinal_canal
    name: Inguinal Canal
    type: fascial_tunnel
    structures: [inguinal_ligament, fascia]
    notes: Oblique passage through abdominal wall conveying spermatic cord or round ligament; bounded by deep/superficial rings.

  - id: thoracolumbar_fascia_connection
    name: Thoracolumbar Fascia Continuity
    type: fascial_connection
    structures: [thoracolumbar_fascia_abdominal, pelvis]
    notes: Fascia anchors transversus and oblique muscles to lumbar spine and pelvis for force transmission.
