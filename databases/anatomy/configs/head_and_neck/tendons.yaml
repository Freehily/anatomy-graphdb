---
# tendons.yaml documents shared tendons of suprahyoid and infrahyoid muscles.

tendons:
  - id: digastric_intermediate_tendon
    name: Digastric Intermediate Tendon
    origin_muscles: [digastric]
    insertion: [hyoid_body]
    notes: Fascial sling securing digastric bellies to the hyoid bone.

  - id: omohyoid_intermediate_tendon
    name: Omohyoid Intermediate Tendon
    origin_muscles: [omohyoid]
    insertion: [intermediate_tendon_omohyoid]
    notes: Tendinous sling redirecting omohyoid muscle between inferior and superior bellies.
