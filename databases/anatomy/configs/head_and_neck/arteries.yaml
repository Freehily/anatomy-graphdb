---
# arteries.yaml lists arterial supply for head and neck muscles defined here.

arteries:
  - id: external_carotid_artery
    name: External Carotid Artery
    branches_from: common_carotid_artery
    supplies: []

  - id: common_carotid_artery
    name: Common Carotid Artery
    branches_from: aorta
    supplies: []

  - id: facial_artery
    name: Facial Artery
    branches_from: external_carotid_artery
    supplies: [digastric_anterior_belly, mylohyoid_head, stylohyoid_head]

  - id: occipital_artery
    name: Occipital Artery
    branches_from: external_carotid_artery
    supplies: [sternocleidomastoid_sternal_head, sternocleidomastoid_clavicular_head, digastric_posterior_belly]

  - id: superior_thyroid_artery
    name: Superior Thyroid Artery
    branches_from: external_carotid_artery
    supplies: [sternocleidomastoid_sternal_head, sternocleidomastoid_clavicular_head, sternohyoid_head, thyrohyoid_head, omohyoid_superior_head]

  - id: lingual_artery
    name: Lingual Artery
    branches_from: external_carotid_artery
    supplies: [geniohyoid_head]

  - id: inferior_thyroid_artery
    name: Inferior Thyroid Artery
    branches_from: thyrocervical_trunk
    supplies: [sternothyroid_head]

  - id: thyrocervical_trunk
    name: Thyrocervical Trunk
    branches_from: subclavian_artery
    supplies: []

  - id: subclavian_artery
    name: Subclavian Artery
    branches_from: aorta
    supplies: []

  - id: transverse_cervical_artery
    name: Transverse Cervical Artery
    branches_from: thyrocervical_trunk
    supplies: [omohyoid_inferior_head]
