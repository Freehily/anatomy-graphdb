---
# tendons.yaml captures prominent lower limb tendons.

tendons:
  - id: quadriceps_tendon
    name: Quadriceps Tendon
    origin_muscles: [rectus_femoris, vastus_lateralis, vastus_medialis, vastus_intermedius]
    insertion: [base_of_patella]
    notes: Proximal tendon enveloping the patella before continuing as the patellar ligament.

  - id: calcaneal_tendon
    name: Calcaneal (Achilles) Tendon
    origin_muscles: [gastrocnemius, soleus, plantaris]
    insertion: [calcaneal_tuberosity]
    notes: Strongest tendon in the body transmitting plantarflexion force to the calcaneus.

  - id: pes_anserinus_tendon
    name: Pes Anserinus Tendinous Complex
    origin_muscles: [sartorius, gracilis, semitendinosus]
    insertion: [pes_anserinus]
    notes: Conjoined tendons of medial thigh muscles inserting onto medial proximal tibia.
