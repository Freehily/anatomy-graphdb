ligaments:
- id: annular_ligament_radius
  name: Annular Ligament of Radius
  attachments:
  - radial_notch
  - head_of_radius
  notes: Rings the radial head to maintain proximal radioulnar joint alignment during
    pronation-supination.
- id: coracoclavicular_ligament
  name: Coracoclavicular Ligament
  attachments:
  - coracoid_process
  - acromial_end
  notes: Includes conoid and trapezoid components stabilising the acromioclavicular
    joint.
- id: costotransverse_ligament
  name: Costotransverse Ligament
  attachments:
  - transverse_processes_T1_T12
  - ribs_1_11_superior_border
  notes: Binds rib tubercles to vertebral transverse processes, stabilising the costotransverse
    joint.
- id: hyoepiglottic_ligament
  name: Hyoepiglottic Ligament
  attachments:
  - hyoid_body
  - thyroid_cartilage_lamina
  notes: Connects epiglottis to hyoid body to help maintain airway patency during
    swallowing.
- id: iliofemoral_ligament
  name: Iliofemoral Ligament
  attachments:
  - anterior_inferior_iliac_spine
  - intertrochanteric_line
  notes: Y-shaped ligament resisting hip extension and external rotation.
- id: inguinal_ligament_band
  name: Inguinal Ligament
  attachments:
  - anterior_superior_iliac_spine
  - pubic_tubercle
  notes: Aponeurotic band forming the base of the inguinal canal.
- id: linea_alba_fusion
  name: Linea Alba
  attachments:
  - xiphoid_process
  - pubic_symphyseal_surface
  notes: Midline fibrous raphe receiving aponeuroses of abdominal wall muscles.
- id: long_plantar_ligament
  name: Long Plantar Ligament
  attachments:
  - calcaneal_tuberosity_lateral_process
  - metatarsal_bases_2_4
  notes: Spans lateral longitudinal arch stabilising calcaneocuboid joint and peroneus
    longus tunnel.
- id: nuchal_ligament
  name: Ligamentum Nuchae
  attachments:
  - external_occipital_protuberance
  - ligamentum_nuchae
  notes: Midline fibroelastic septum maintaining cervical posture and serving as muscle
    attachment.
- id: patellar_ligament
  name: Patellar Ligament
  attachments:
  - apex_of_patella
  - tibial_tuberosity
  notes: Distal continuation of the quadriceps tendon anchoring patella to tibia.
- id: plantar_aponeurosis_band
  name: Plantar Aponeurosis Central Band
  attachments:
  - calcaneal_tuberosity_medial_process
  - plantar_aponeurosis
  notes: Thick fascia extending toward the toes to support the longitudinal arch.
- id: pubofemoral_ligament
  name: Pubofemoral Ligament
  attachments:
  - pubic_superior_ram
  - lesser_trochanter
  notes: Limits excessive hip abduction and extension.
- id: radial_carpometacarpal_ligament
  name: Radial Carpometacarpal Ligament
  attachments:
  - tubercle_trapezium
  - base_first_metacarpal_lateral
  notes: Reinforces thumb carpometacarpal joint capsule on the radial aspect.
- id: radiate_sternocostal_ligament
  name: Radiate Sternocostal Ligaments
  attachments:
  - sternal_body
  - costal_cartilages_1_7_anterior
  notes: Reinforce anterior sternocostal joints for ribs 2-7.
- id: sacrospinous_ligament
  name: Sacrospinous Ligament
  attachments:
  - sacral_coccygeal_margin
  - ischial_spine
  notes: Converts the greater sciatic notch into the greater sciatic foramen.
- id: sacrotuberous_ligament
  name: Sacrotuberous Ligament
  attachments:
  - sacral_coccygeal_margin
  - ischial_tuberosity
  notes: Strengthens sacroiliac joint and forms part of greater and lesser sciatic
    foramina boundaries.
- id: stylomandibular_ligament
  name: Stylomandibular Ligament
  attachments:
  - styloid_process
  - mandibular_angle
  notes: Fibrous band from styloid process to mandibular angle limiting excessive
    protrusion.
- id: superior_glenohumeral_ligament
  name: Superior Glenohumeral Ligament
  attachments:
  - glenoid_cavity
  - lesser_tubercle
  notes: Reinforces the anterior superior portion of the glenohumeral capsule and
    supports the biceps long head tendon.
- id: supraspinous_ligament
  name: Supraspinous Ligament
  attachments:
  - spinous_processes_C3_T12
  - spinous_processes_T7_L5
  notes: Connects posterior tips of vertebral spinous processes limiting spinal flexion.
- id: thoracolumbar_fascia_posterior_layer
  name: Thoracolumbar Fascia (Posterior Layer)
  attachments:
  - thoracolumbar_fascia_back
  - iliac_crest_back
  notes: Dense fascial sheet anchoring intrinsic back muscles to pelvis.
- id: transverse_metacarpal_ligament
  name: Deep Transverse Metacarpal Ligament
  attachments:
  - metacarpal_shaft_palmar_2_to_5
  notes: Connects palmar plates of metacarpal heads to maintain metacarpal arch stability.
- id: transverse_metatarsal_ligament_foot
  name: Deep Transverse Metatarsal Ligament
  attachments:
  - metatarsal_heads_2_5
  notes: Connects plantar plates of metatarsal heads 2-5 to maintain transverse arch.
- id: ulnar_collateral_elbow_ligament
  name: Ulnar Collateral Ligament of Elbow
  attachments:
  - medial_epicondyle
  - coronoid_process
  notes: Medial stabiliser of the humeroulnar joint resisting valgus stress.
- id: ulnar_collateral_thumb_ligament
  name: Ulnar Collateral Ligament of Thumb MCP
  attachments:
  - base_first_metacarpal_medial
  - proximal_phalanx_thumb_medial
  notes: Prevents excessive radial deviation at the first metacarpophalangeal joint.
