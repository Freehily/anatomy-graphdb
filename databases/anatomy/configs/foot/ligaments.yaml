ligaments:
- id: plantar_aponeurosis_band
  name: Plantar Aponeurosis Central Band
  attachments:
  - calcaneal_tuberosity_medial_process
  - plantar_aponeurosis
  notes: Thick fascia extending toward the toes to support the longitudinal arch.
- id: long_plantar_ligament
  name: Long Plantar Ligament
  attachments:
  - calcaneal_tuberosity_lateral_process
  - metatarsal_bases_2_4
  notes: Spans lateral longitudinal arch stabilising calcaneocuboid joint and peroneus
    longus tunnel.
- id: transverse_metatarsal_ligament_foot
  name: Deep Transverse Metatarsal Ligament
  attachments:
  - metatarsal_heads_2_5
  notes: Connects plantar plates of metatarsal heads 2-5 to maintain transverse arch.
