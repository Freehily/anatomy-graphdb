---
# muscles.yaml enumerates intrinsic foot muscles using muscle head definitions.

muscles:
  - id: abductor_hallucis
    name: Abductor Hallucis
    group: Plantar Foot (1st Layer)
    order: Foot
    heads: [abductor_hallucis_head]
    insertion: [medial_tubercle_proximal_phalanx_hallux, medial_tubercle_1st_metatarsal]
    actions: [toe_abduction_hallux, toe_flexion_hallux_assist]
    antagonists: []

  - id: flexor_digitorum_brevis
    name: Flexor Digitorum Brevis
    group: Plantar Foot (1st Layer)
    order: Foot
    heads: [flexor_digitorum_brevis_head]
    insertion: [middle_phalanges_2_5]
    actions: [toe_flexion_digits_2_5]
    antagonists: []

  - id: abductor_digiti_minimi
    name: Abductor Digiti Minimi
    group: Plantar Foot (1st Layer)
    order: Foot
    heads: [abductor_digiti_minimi_head]
    insertion: [proximal_phalanges_3_5_lateral, base_5th_metatarsal]
    actions: [toe_abduction_digit5]
    antagonists: []

  - id: quadratus_plantae
    name: Quadratus Plantae
    group: Plantar Foot (2nd Layer)
    order: Foot
    heads: [quadratus_plantae_head]
    insertion: [tendons_flexor_digitorum_longus_2_5]
    actions: [toe_flexion_digits_2_5_assist]
    antagonists: []

  - id: lumbrical_1
    name: Lumbrical 1
    group: Plantar Foot (2nd Layer)
    order: Foot
    heads: [lumbrical_1_head]
    insertion: [extensor_expansion_toe2, proximal_phalanges_2_5_medial]
    actions: [toe_flexion_mtp_2, toe_extension_ip_2]
    antagonists: []

  - id: lumbricals_2_4
    name: Lumbricals 2-4
    group: Plantar Foot (2nd Layer)
    order: Foot
    heads: [lumbrical_2_4_head]
    insertion: [extensor_expansion_toe3, extensor_expansion_toe4, extensor_expansion_toe5, proximal_phalanges_2_5_medial]
    actions: [toe_flexion_mtp_3_5, toe_extension_ip_3_5]
    antagonists: []
