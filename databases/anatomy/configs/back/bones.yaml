---
# bones.yaml enumerates vertebral and scapular elements relevant to back musculature.

bones:
  - id: skull
    name: Skull
    region: Head
    attachments: [external_occipital_protuberance, superior_nuchal_line, mastoid_process]

  - id: cervical_vertebrae
    name: Cervical Vertebrae
    region: Spine
    attachments: [
      spinous_processes_C1_C2,
      transverse_processes_C1_C4
    ]

  - id: thoracic_vertebrae
    name: Thoracic Vertebrae
    region: Spine
    attachments: [
      spinous_processes_C3_T12,
      spinous_processes_T1_T12,
      transverse_processes_T1_T12
    ]

  - id: lumbar_vertebrae
    name: Lumbar Vertebrae
    region: Spine
    attachments: [
      transverse_processes_L1_L5
    ]

  - id: thoracolumbar_spine
    name: Thoracolumbar Spine
    region: Spine
    attachments: [
      spinous_processes_T7_L5,
      thoracolumbar_fascia_back
    ]

  - id: sacrum
    name: Sacrum
    region: Pelvis
    attachments: [sacral_crest]

  - id: thoracic_ribs
    name: Ribs
    region: Thorax
    attachments: [
      ribs_3_6,
      ribs_6_12,
      ribs_9_12
    ]

  - id: scapula
    name: Scapula
    region: Shoulder Girdle
    attachments: [
      superior_angle_scapula,
      medial_border_scapula,
      spine_of_scapula,
      inferior_angle_scapula,
      acromion_process
    ]

  - id: clavicle
    name: Clavicle
    region: Shoulder Girdle
    attachments: [lateral_clavicle]

  - id: pelvis
    name: Pelvis
    region: Pelvis
    attachments: [iliac_crest_back]

  - id: ligaments
    name: Ligaments
    region: Connective Tissue
    attachments: [ligamentum_nuchae]

  - id: fascia
    name: Back Fascia
    region: Connective Tissue
    attachments: [thoracolumbar_fascia_back]
