---
# ligaments.yaml lists axial ligaments supporting the posterior spine.

ligaments:
  - id: nuchal_ligament
    name: Ligamentum Nuchae
    attachments: [external_occipital_protuberance, ligamentum_nuchae]
    notes: Midline fibroelastic septum maintaining cervical posture and serving as muscle attachment.

  - id: supraspinous_ligament
    name: Supraspinous Ligament
    attachments: [spinous_processes_C3_T12, spinous_processes_T7_L5]
    notes: Connects posterior tips of vertebral spinous processes limiting spinal flexion.

  - id: thoracolumbar_fascia_posterior_layer
    name: Thoracolumbar Fascia (Posterior Layer)
    attachments: [thoracolumbar_fascia_back, iliac_crest_back]
    notes: Dense fascial sheet anchoring intrinsic back muscles to pelvis.
