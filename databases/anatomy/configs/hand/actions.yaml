---
# actions.yaml defines intrinsic hand actions tied to muscles in this region.

actions:
  - id: skin_tension_hypothenar
    name: Hypothenar Skin Tension
    joint: palmar_skin
    type: tension
    primary_movers: [palmaris_brevis]

  - id: finger_abduction_index
    name: Index Finger Abduction
    joint: metacarpophalangeal_2
    type: abduction
    primary_movers: [dorsal_interosseous_1]

  - id: finger_abduction_middle
    name: Middle Finger Abduction
    joint: metacarpophalangeal_3
    type: abduction
    primary_movers: [dorsal_interosseous_2, dorsal_interosseous_3]

  - id: finger_abduction_ring
    name: Ring Finger Abduction
    joint: metacarpophalangeal_4
    type: abduction
    primary_movers: [dorsal_interosseous_4]

  - id: finger_adduction_index
    name: Index Finger Adduction
    joint: metacarpophalangeal_2
    type: adduction
    primary_movers: [palmar_interosseous_1]

  - id: finger_adduction_ring
    name: Ring Finger Adduction
    joint: metacarpophalangeal_4
    type: adduction
    primary_movers: [palmar_interosseous_2]

  - id: finger_adduction_little
    name: Little Finger Adduction
    joint: metacarpophalangeal_5
    type: adduction
    primary_movers: [palmar_interosseous_3]
