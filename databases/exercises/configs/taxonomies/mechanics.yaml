mechanics:
  - id: compound
    name: Compound
    description: Involves multiple joints and large muscle groups.
    aliases: ["Compound"]
  - id: isolation
    name: Isolation
    description: Focuses on a single joint and muscle group.
    aliases: ["Isolation"]
  - id: pull_mechanics
    name: Pull Mechanics
    description: Movements identified specifically as pull-focused.
    aliases: ["Pull"]
  - id: unilateral
    name: Unilateral
    description: Performed with one limb at a time.
  - id: bilateral
    name: Bilateral
    description: Performed with both limbs simultaneously.
  - id: alternating
    name: Alternating
    description: Alternates sides in rhythmic fashion (e.g., alternating lunges).
  - id: contralateral
    name: Contralateral
    description: Upper and lower limbs work on opposite sides of the body.
  - id: ipsilateral
    name: Ipsilateral
    description: Upper and lower limbs work on the same side.
