---
# attachment_points.yaml defines anatomical landmarks used as connection points for muscles on bones or related structures.

# Each attachment_point node has the following fields:
#   id (node id): Unique identifier for the attachment point (used in muscle origins/insertions).
#   name (property): Human-readable name of the anatomical landmark.
#   bone (relationship): The bone node ID this attachment point belongs to (defined in bones.yaml).

