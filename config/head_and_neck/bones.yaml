---
# bones.yaml defines cranial, mandibular, and hyoid structures used by neck muscles.

bones:
  - id: skull
    name: Skull
    region: Head
    attachments: [
      external_occipital_protuberance,
      superior_nuchal_line,
      mastoid_process,
      mastoid_notch,
      styloid_process
    ]

  - id: mandible
    name: Mandible
    region: Head
    attachments: [
      mandibular_body,
      mandibular_angle,
      digastric_fossa,
      mylohyoid_line,
      inferior_mental_spine
    ]

  - id: hyoid
    name: Hyoid Bone
    region: Neck
    attachments: [
      hyoid_body,
      greater_horn_hyoid,
      lesser_horn_hyoid
    ]

  - id: laryngeal_cartilage
    name: Laryngeal Cartilage
    region: Neck
    attachments: [thyroid_cartilage_lamina]

  - id: sternum
    name: Sternum
    region: Thorax
    attachments: [manubrium]

  - id: clavicle
    name: Clavicle
    region: Shoulder Girdle
    attachments: [medial_clavicle]

  - id: scapula
    name: Scapula
    region: Shoulder Girdle
    attachments: [superior_border_scapula]

  - id: tendons
    name: Tendons
    region: Connective Tissue
    attachments: [intermediate_tendon_omohyoid]

  - id: fascia
    name: Cervical Fascia
    region: Connective Tissue
    attachments: [mylohyoid_raphe, pretracheal_fascia]
