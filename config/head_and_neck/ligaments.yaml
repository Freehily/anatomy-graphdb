---
# ligaments.yaml enumerates select cervical ligaments supporting the hyoid and mandible.

ligaments:
  - id: stylomandibular_ligament
    name: Stylomandibular Ligament
    attachments: [styloid_process, mandibular_angle]
    notes: Fibrous band from styloid process to mandibular angle limiting excessive protrusion.

  - id: hyoepiglottic_ligament
    name: Hyoepiglottic Ligament
    attachments: [hyoid_body, thyroid_cartilage_lamina]
    notes: Connects epiglottis to hyoid body to help maintain airway patency during swallowing.
