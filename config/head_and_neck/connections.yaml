---
# connections.yaml outlines key joints and fascial linkages in the head and neck region.

connections:
  - id: temporomandibular_joint
    name: Temporomandibular Joint
    type: synovial_ginglymoarthrodial
    structures: [skull, mandible]
    notes: Articulation between mandibular condyle and temporal bone with articular disc permitting hinge and gliding movements.

  - id: atlanto_occipital_joint
    name: Atlanto-Occipital Joint
    type: synovial_condylar
    structures: [skull, cervical_vertebrae]
    notes: Allows nodding motion; stabilized by atlanto-occipital membranes.

  - id: atlanto_axial_joint
    name: Atlanto-Axial Joint
    type: synovial_pivot
    structures: [cervical_vertebrae]
    notes: Dens of axis pivots within atlas, enabling head rotation.

  - id: hyoid_suspension
    name: Hyoid Suspension Complex
    type: fascial_connection
    structures: [hyoid, mandible, skull]
    notes: Suprahyoid and infrahyoid muscles sling the hyoid between mandible and sternum/clavicle.
