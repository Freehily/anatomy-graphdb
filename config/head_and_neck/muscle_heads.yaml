---
# muscle_heads.yaml defines head and neck muscle components.

muscle_heads:
  - id: sternocleidomastoid_sternal_head
    name: Sternocleidomastoid (Sternal Head)
    origin: [manubrium]
    innervation: [spinal_accessory_nerve]
    arteries: [occipital_artery, superior_thyroid_artery]

  - id: sternocleidomastoid_clavicular_head
    name: Sternocleidomastoid (Clavicular Head)
    origin: [medial_clavicle]
    innervation: [spinal_accessory_nerve]
    arteries: [occipital_artery, superior_thyroid_artery]

  - id: digastric_anterior_belly
    name: Digastric (Anterior Belly)
    origin: [digastric_fossa]
    innervation: [nerve_to_mylohyoid]
    arteries: [facial_artery]

  - id: digastric_posterior_belly
    name: Digastric (Posterior Belly)
    origin: [mastoid_notch]
    innervation: [facial_nerve]
    arteries: [occipital_artery]

  - id: mylohyoid_head
    name: Mylohyoid
    origin: [mylohyoid_line]
    innervation: [nerve_to_mylohyoid]
    arteries: [facial_artery]

  - id: stylohyoid_head
    name: Stylohyoid
    origin: [styloid_process]
    innervation: [facial_nerve]
    arteries: [facial_artery]

  - id: geniohyoid_head
    name: Geniohyoid
    origin: [inferior_mental_spine]
    innervation: [hypoglossal_nerve]
    arteries: [lingual_artery]

  - id: sternohyoid_head
    name: Sternohyoid
    origin: [manubrium]
    innervation: [ansa_cervicalis]
    arteries: [superior_thyroid_artery]

  - id: sternothyroid_head
    name: Sternothyroid
    origin: [manubrium]
    innervation: [ansa_cervicalis]
    arteries: [inferior_thyroid_artery]

  - id: thyrohyoid_head
    name: Thyrohyoid
    origin: [thyroid_cartilage_lamina]
    innervation: [hypoglossal_nerve]
    arteries: [superior_thyroid_artery]

  - id: omohyoid_inferior_head
    name: Omohyoid (Inferior Belly)
    origin: [superior_border_scapula]
    innervation: [ansa_cervicalis]
    arteries: [transverse_cervical_artery]

  - id: omohyoid_superior_head
    name: Omohyoid (Superior Belly)
    origin: [intermediate_tendon_omohyoid]
    innervation: [ansa_cervicalis]
    arteries: [superior_thyroid_artery]
