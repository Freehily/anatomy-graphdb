---
# connections.yaml summarizes key upper limb articulations and fascial tunnels.

connections:
  - id: shoulder_joint_capsule
    name: Glenohumeral Joint Capsule
    type: synovial_ball_and_socket
    structures: [scapula, humerus]
    notes: Reinforced by rotator cuff tendons and glenohumeral ligaments allowing large range of motion.

  - id: rotator_cuff_interval
    name: Rotator Cuff Interval
    type: fascial_connection
    structures: [humerus, scapula, fascia]
    notes: Region between supraspinatus and subscapularis tendons containing the biceps long head tendon.

  - id: intertubercular_sulcus_sheath
    name: Intertubercular Sulcus Tendon Sheath
    type: tendon_sheath
    structures: [humerus, fascia]
    notes: Synovial sheath for long head of biceps tendon within the bicipital groove.

  - id: cubital_tunnel
    name: Cubital Tunnel
    type: fibro-osseous_tunnel
    structures: [humerus, ulna, fascia]
    notes: Passage posterior to medial epicondyle conveying ulnar nerve between Osborne's ligament and flexor carpi ulnaris.

  - id: radial_tunnel
    name: Radial Tunnel
    type: fibro-osseous_tunnel
    structures: [humerus, radius, fascia]
    notes: Space extending from radiocapitellar joint to supinator arch transmitting posterior interosseous nerve.

  - id: carpal_tunnel_upper_limb
    name: Carpal Tunnel
    type: fibro-osseous_tunnel
    structures: [flexor_retinaculum, radius, ulna]
    notes: Bony and ligamentous tunnel at wrist conveying median nerve and flexor tendons.
