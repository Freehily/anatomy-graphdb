---
# muscle_heads.yaml defines thoracic muscle components with origin/innervation/arterial supply.

muscle_heads:
  - id: external_intercostals
    name: External Intercostals
    origin: [ribs_1_11_inferior_border]
    innervation: [intercostal_nerves]
    arteries: [posterior_intercostal_arteries, anterior_intercostal_arteries]

  - id: internal_intercostals
    name: Internal Intercostals
    origin: [ribs_1_11_superior_border]
    innervation: [intercostal_nerves]
    arteries: [posterior_intercostal_arteries, anterior_intercostal_arteries]

  - id: innermost_intercostals
    name: Innermost Intercostals
    origin: [ribs_1_11_superior_border]
    innervation: [intercostal_nerves]
    arteries: [posterior_intercostal_arteries, anterior_intercostal_arteries]

  - id: subcostals
    name: Subcostals
    origin: [rib_angles_lower]
    innervation: [intercostal_nerves]
    arteries: [posterior_intercostal_arteries]

  - id: transversus_thoracis
    name: Transversus Thoracis
    origin: [sternal_body, xiphoid_process]
    innervation: [intercostal_nerves]
    arteries: [internal_thoracic_artery]

  - id: serratus_posterior_superior
    name: Serratus Posterior Superior
    origin: [nuchal_ligament, spinous_processes_C7_T3]
    innervation: [intercostal_nerves]
    arteries: [posterior_intercostal_arteries]

  - id: serratus_posterior_inferior
    name: Serratus Posterior Inferior
    origin: [spinous_processes_T11_L2, thoracolumbar_fascia]
    innervation: [intercostal_nerves, subcostal_nerve]
    arteries: [posterior_intercostal_arteries, subcostal_artery]

  - id: levatores_costarum
    name: Levatores Costarum
    origin: [transverse_processes_T7_T11]
    innervation: [posterior_primary_rami_T7_T12]
    arteries: [posterior_intercostal_arteries]

  - id: diaphragm_sternal
    name: Diaphragm (Sternal Part)
    origin: [xiphoid_process]
    innervation: [phrenic_nerve]
    arteries: [superior_phrenic_artery, musculophrenic_artery]

  - id: diaphragm_costal
    name: Diaphragm (Costal Part)
    origin: [costal_margin_internal_surface, ribs_7_10_internal_surface, rib_12_inferior_border]
    innervation: [phrenic_nerve]
    arteries: [superior_phrenic_artery, musculophrenic_artery]

  - id: diaphragm_lumbar
    name: Diaphragm (Lumbar Part)
    origin: [lumbar_bodies_L1_L3, medial_arcuate_ligaments, lateral_arcuate_ligaments]
    innervation: [phrenic_nerve]
    arteries: [inferior_phrenic_artery, superior_phrenic_artery]
