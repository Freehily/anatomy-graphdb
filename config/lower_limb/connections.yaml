---
# connections.yaml lists key articulations and fascial continuities in the lower limb.

connections:
  - id: sacroiliac_joint
    name: Sacroiliac Joint
    type: synovial_planar
    structures: [pelvis, sacrum]
    notes: Strong ligaments limit motion while transmitting forces between trunk and lower limb.

  - id: hip_joint
    name: Hip Joint
    type: synovial_ball_and_socket
    structures: [pelvis, femur]
    notes: Acetabulum articulates with femoral head allowing triaxial motion.

  - id: knee_joint
    name: Knee Joint
    type: synovial_hinge
    structures: [femur, tibia, patella]
    notes: Includes tibiofemoral and patellofemoral articulations stabilized by cruciate and collateral ligaments.

  - id: proximal_tibiofibular_joint
    name: Proximal Tibiofibular Joint
    type: synovial_planar
    structures: [tibia, fibula]
    notes: Small gliding joint allowing accommodation of ankle motion.

  - id: distal_tibiofibular_joint
    name: Distal Tibiofibular Syndesmosis
    type: syndesmosis
    structures: [tibia, fibula]
    notes: Strong interosseous ligaments provide ankle stability; injury causes high ankle sprain.

  - id: talocrural_joint
    name: Talocrural (Ankle) Joint
    type: synovial_hinge
    structures: [tibia, fibula, foot]
    notes: Mortise formed by tibia and fibula grips talus for dorsiflexion and plantarflexion.

  - id: subtalar_joint
    name: Subtalar Joint
    type: synovial_plane
    structures: [calcaneus, foot]
    notes: Allows inversion and eversion between talus and calcaneus.

  - id: patellar_tendon_connection
    name: Patellar Tendon
    type: tendon
    structures: [base_of_patella, tibial_tuberosity]
    notes: Continuation of quadriceps tendon transmitting knee extension force.
