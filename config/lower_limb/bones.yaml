---
# bones.yaml enumerates major lower limb bones and the attachment landmarks they expose.

bones:
  - id: pelvis
    name: Pelvis
    region: Pelvic Girdle
    attachments: [
      anterior_superior_iliac_spine,
      anterior_inferior_iliac_spine,
      posterior_superior_iliac_spine,
      iliac_crest,
      iliac_fossa,
      gluteal_surface_ilium,
      ischial_tuberosity,
      ischial_spine,
      pubic_body,
      pubic_superior_ram,
      pubic_inferior_ram,
      pectineal_line_pubis
    ]

  - id: femur
    name: Femur
    region: Thigh
    attachments: [
      greater_trochanter,
      lesser_trochanter,
      gluteal_tuberosity,
      intertrochanteric_line,
      anterior_femoral_shaft,
      pectineal_line_femur,
      linea_aspera,
      medial_femoral_condyle,
      lateral_femoral_condyle,
      adductor_tubercle
    ]

  - id: patella
    name: Patella
    region: Knee
    attachments: [base_of_patella, apex_of_patella]

  - id: tibia
    name: Tibia
    region: Leg
    attachments: [
      medial_tibial_condyle,
      lateral_tibial_condyle,
      tibial_tuberosity,
      pes_anserinus,
      tibial_shaft_medial,
      soleal_line,
      medial_malleolus
    ]

  - id: fibula
    name: Fibula
    region: Leg
    attachments: [head_of_fibula, fibular_shaft, lateral_malleolus]

  - id: calcaneus
    name: Calcaneus
    region: Foot
    attachments: [calcaneal_tuberosity]

  - id: sacrum
    name: Sacrum
    region: Pelvis
    attachments: [dorsal_surface_sacrum]

  - id: foot
    name: Foot Bones
    region: Foot
    attachments: [
      navicular_tuberosity,
      medial_cuneiform,
      intermediate_cuneiform,
      lateral_cuneiform,
      cuboid_tuberosity,
      base_1st_metatarsal,
      base_5th_metatarsal,
      metatarsal_heads_2_5,
      proximal_phalanges_2_5_plantar,
      distal_phalanx_hallux
    ]

  - id: fascia
    name: Lower Limb Fascia
    region: Connective Tissue
    attachments: [plantar_aponeurosis, iliotibial_tract]
