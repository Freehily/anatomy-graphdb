---
# muscle_heads.yaml defines abdominal muscle components used by muscles.yaml.

muscle_heads:
  - id: rectus_abdominis_head
    name: Rectus Abdominis
    origin: [pubic_crest, pubic_symphyseal_surface]
    innervation: [thoracoabdominal_nerves]
    arteries: [superior_epigastric_artery, inferior_epigastric_artery]

  - id: external_oblique_head
    name: External Oblique
    origin: [costal_margins_5_12]
    innervation: [thoracoabdominal_nerves]
    arteries: [lower_posterior_intercostal_arteries]

  - id: internal_oblique_head
    name: Internal Oblique
    origin: [thoracolumbar_fascia_abdominal, iliac_crest_anterior, inguinal_ligament]
    innervation: [thoracoabdominal_nerves, ilioinguinal_nerve]
    arteries: [inferior_epigastric_artery, deep_circumflex_iliac_artery]

  - id: transversus_abdominis_head
    name: Transversus Abdominis
    origin: [thoracolumbar_fascia_abdominal, costal_margins_5_12, iliac_crest_anterior, inguinal_ligament]
    innervation: [thoracoabdominal_nerves, iliohypogastric_nerve]
    arteries: [deep_circumflex_iliac_artery, inferior_epigastric_artery]
