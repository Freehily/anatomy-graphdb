---
# muscles.yaml enumerates abdominal wall muscles with insertions and actions.

muscles:
  - id: rectus_abdominis
    name: Rectus Abdominis
    group: Anterior Abdominal Wall
    order: Abdomen
    heads: [rectus_abdominis_head]
    insertion: [xiphoid_process, costal_margins_5_12, linea_alba]
    actions: [trunk_flexion, abdominal_compression]
    antagonists: []

  - id: external_oblique
    name: External Oblique
    group: Lateral Abdominal Wall
    order: Abdomen
    heads: [external_oblique_head]
    insertion: [linea_alba, pubic_crest, inguinal_ligament, iliac_crest_anterior]
    actions: [trunk_rotation_contralateral, trunk_flexion, abdominal_compression]
    antagonists: []

  - id: internal_oblique
    name: Internal Oblique
    group: Lateral Abdominal Wall
    order: Abdomen
    heads: [internal_oblique_head]
    insertion: [linea_alba, costal_margins_5_12, pubic_crest]
    actions: [trunk_rotation_ipsilateral, trunk_flexion, abdominal_compression]
    antagonists: []

  - id: transversus_abdominis
    name: Transversus Abdominis
    group: Lateral Abdominal Wall
    order: Abdomen
    heads: [transversus_abdominis_head]
    insertion: [linea_alba, pubic_crest, rectus_sheath]
    actions: [abdominal_compression, trunk_stabilization]
    antagonists: []
