nerves:
- id: spinal_accessory_nerve
  name: Spinal Accessory Nerve (CN XI)
  derivations:
  - C1
  - C2
  - Cranial
  type:
  - motor
  pathway: Exits jugular foramen, travels deep to trapezius along posterior triangle.
  clinical_significance: Injury causes shoulder droop and weakened scapular elevation.
  innervates:
  - trapezius_upper_head
  - trapezius_middle_head
  - trapezius_lower_head
- id: dorsal_scapular_nerve
  name: Dorsal Scapular Nerve
  derivations:
  - C4
  - C5
  type:
  - motor
  pathway: Pierces middle scalene, descends along medial scapular border.
  clinical_significance: Lesions weaken scapular retraction and elevation.
  innervates:
  - levator_scapulae_head
  - rhomboid_minor_head
  - rhomboid_major_head
- id: thoracodorsal_nerve
  name: Thoracodorsal Nerve
  derivations:
  - C6
  - C7
  - C8
  type:
  - motor
  pathway: Runs with thoracodorsal artery along posterior axillary wall to latissimus
    dorsi.
  clinical_significance: Damage during axillary surgery compromises shoulder extension
    and adduction.
  innervates:
  - latissimus_dorsi_head
- id: intercostal_nerves
  name: Intercostal Nerves
  derivations:
  - T1
  - T2
  - T3
  - T4
  - T5
  - T6
  - T7
  - T8
  - T9
  - T10
  - T11
  type:
  - motor
  - sensory
  pathway: Travel within intercostal spaces beneath ribs, supplying thoracic wall
    and overlying muscles.
  clinical_significance: Entrapment causes segmental thoracic pain and breathing difficulty.
  innervates:
  - serratus_posterior_inferior_back_head
