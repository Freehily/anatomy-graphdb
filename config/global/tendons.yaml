tendons:
- id: abductor_hallucis_tendon
  name: Abductor Hallucis Tendon
  origin_muscles:
  - abductor_hallucis
  insertion:
  - medial_tubercle_proximal_phalanx_hallux
  notes: Medial border tendon assisting hallux abduction and arch support.
- id: calcaneal_tendon
  name: Calcaneal (Achilles) Tendon
  origin_muscles:
  - gastrocnemius
  - soleus
  - plantaris
  insertion:
  - calcaneal_tuberosity
  notes: Strongest tendon in the body transmitting plantarflexion force to the calcaneus.
- id: common_flexor_tendon
  name: Common Flexor Tendon
  origin_muscles:
  - flexor_carpi_ulnaris
  - flexor_carpi_radialis_head
  - palmaris_longus_head
  - pronator_teres
  insertion:
  - medial_epicondyle
  notes: Shared proximal tendon for superficial anterior forearm muscles.
- id: conjoint_tendon
  name: Conjoint Tendon
  origin_muscles:
  - internal_oblique
  - transversus_abdominis
  insertion:
  - pubic_crest
  - pubic_tubercle
  notes: Combined aponeurotic insertion reinforcing the medial posterior wall of the
    inguinal canal.
- id: diaphragm_central_tendon
  name: Diaphragm Central Tendon
  origin_muscles:
  - diaphragm
  insertion:
  - central_tendon_diaphragm
  notes: Aponeurotic centre where diaphragmatic muscle fibers converge.
- id: digastric_intermediate_tendon
  name: Digastric Intermediate Tendon
  origin_muscles:
  - digastric
  insertion:
  - hyoid_body
  notes: Fascial sling securing digastric bellies to the hyoid bone.
- id: erector_spinae_common_tendon
  name: Erector Spinae Common Tendon
  origin_muscles:
  - erector_spinae_longissimus
  - erector_spinae_iliocostalis
  insertion:
  - sacral_crest
  - thoracolumbar_fascia_back
  - iliac_crest_back
  notes: Broad aponeurosis anchoring erector spinae to sacrum and posterior iliac
    crest.
- id: extensor_digitorum_tendons
  name: Extensor Digitorum Tendons
  origin_muscles:
  - extensor_digitorum
  insertion:
  - extensor_expansion_2
  - extensor_expansion_3
  - extensor_expansion_4
  - extensor_expansion_5
  notes: Pass beneath the extensor retinaculum to form dorsal digital expansions.
- id: flexor_digitorum_brevis_slips
  name: Flexor Digitorum Brevis Slips
  origin_muscles:
  - flexor_digitorum_brevis
  insertion:
  - middle_phalanges_2_5
  notes: Tendinous slips divide for profundus tendons and insert onto middle phalanges.
- id: flexor_digitorum_longus_tendons
  name: Flexor Digitorum Longus Tendons
  origin_muscles:
  - flexor_digitorum_longus
  insertion:
  - tendons_flexor_digitorum_longus_2_5
  notes: Tendons passing through the tarsal tunnel to insert on distal phalanges 2-5
    with aid from quadratus plantae.
- id: flexor_digitorum_profundus_tendons
  name: Flexor Digitorum Profundus Tendons
  origin_muscles:
  - flexor_digitorum_profundus
  insertion:
  - extensor_expansion_2
  - extensor_expansion_3
  - extensor_expansion_4
  - extensor_expansion_5
  notes: Tendons entering the carpal tunnel to reach distal phalanges, sharing sheaths
    with superficialis slips.
- id: long_head_biceps_tendon
  name: Long Head of Biceps Tendon
  origin_muscles:
  - biceps_brachii
  insertion:
  - supraglenoid_tubercle
  - radial_tuberosity
  notes: null
- id: omohyoid_intermediate_tendon
  name: Omohyoid Intermediate Tendon
  origin_muscles:
  - omohyoid
  insertion:
  - intermediate_tendon_omohyoid
  notes: Tendinous sling redirecting omohyoid muscle between inferior and superior
    bellies.
- id: pes_anserinus_tendon
  name: Pes Anserinus Tendinous Complex
  origin_muscles:
  - sartorius
  - gracilis
  - semitendinosus
  insertion:
  - pes_anserinus
  notes: Conjoined tendons of medial thigh muscles inserting onto medial proximal
    tibia.
- id: quadriceps_tendon
  name: Quadriceps Tendon
  origin_muscles:
  - rectus_femoris
  - vastus_lateralis
  - vastus_medialis
  - vastus_intermedius
  insertion:
  - base_of_patella
  notes: Proximal tendon enveloping the patella before continuing as the patellar
    ligament.
- id: triceps_common_tendon
  name: Triceps Common Tendon
  origin_muscles:
  - triceps_brachii
  insertion:
  - olecranon_process
  notes: Distal convergence of triceps heads inserting onto the ulna.
