---
# nerves.yaml catalogs tibial nerve branches supplying intrinsic foot muscles.

nerves:
  - id: medial_plantar_nerve
    name: Medial Plantar Nerve
    derivations: [L4, L5]
    type: [motor, sensory]
    pathway: Branch of tibial nerve passing under flexor retinaculum, coursing along medial plantar surface.
    clinical_significance: Entrapment in tarsal tunnel causes medial plantar neuropathy with hallux weakness.
    innervates: [abductor_hallucis_head, flexor_digitorum_brevis_head, lumbrical_1_head]

  - id: lateral_plantar_nerve
    name: Lateral Plantar Nerve
    derivations: [S1, S2]
    type: [motor, sensory]
    pathway: Branch of tibial nerve dividing into superficial and deep branches across lateral plantar surface.
    clinical_significance: Injury reduces abduction/adduction of toes and causes lateral plantar numbness.
    innervates: [abductor_digiti_minimi_head, quadratus_plantae_head, lumbrical_2_4_head]
