---
# ligaments.yaml lists major pelvic ligaments maintaining pelvic ring stability.

ligaments:
  - id: sacrospinous_ligament
    name: Sacrospinous Ligament
    attachments: [sacral_coccygeal_margin, ischial_spine]
    notes: Converts the greater sciatic notch into the greater sciatic foramen.

  - id: sacrotuberous_ligament
    name: Sacrotuberous Ligament
    attachments: [sacral_coccygeal_margin, ischial_tuberosity]
    notes: Strengthens sacroiliac joint and forms part of greater and lesser sciatic foramina boundaries.

  - id: inguinal_ligament_band
    name: Inguinal Ligament
    attachments: [anterior_superior_iliac_spine, pubic_tubercle]
    notes: Aponeurotic band forming the base of the inguinal canal.
