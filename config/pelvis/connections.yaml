---
# connections.yaml outlines major pelvic articulations and fascial continuities.

connections:
  - id: sacroiliac_joint
    name: Sacroiliac Joint
    type: synovial
    structures: [pelvis, sacrum]
    notes: Strong interosseous and posterior sacroiliac ligaments transmit trunk forces to lower limbs.

  - id: pubic_symphysis
    name: Pubic Symphysis
    type: symphysis
    structures: [pelvis]
    notes: Fibrocartilaginous joint between pubic bodies allowing minimal movement, relaxed during childbirth.

  - id: sacrococcygeal_joint
    name: Sacrococcygeal Joint
    type: symphysis
    structures: [sacrum, coccyx]
    notes: Supports pelvic floor; slight flexion and extension occur during defecation and childbirth.

  - id: obturator_membrane
    name: Obturator Membrane
    type: ligamentous_sheet
    structures: [pelvis]
    notes: Fibrous sheet closing the obturator foramen except the obturator canal for neurovascular passage.
